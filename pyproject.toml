[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tianji-cooking"
version = "0.1.0"
description = "Lightweight Tianji dual-arm and Wuji Hand cooking robotics workspace"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
simulation = ["mujoco==3.10.0"]
data = ["mcap>=1.3,<2"]
teleop = []
hardware = ["wujihandpy>=1.8,<2"]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/robot_core/src",
  "packages/cooking_simulation/src",
  "packages/wuji_hand/src",
  "packages/tianji_arm/src",
  "packages/cooking_workflows/src",
]
